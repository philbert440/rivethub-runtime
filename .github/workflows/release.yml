name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SQLX_OFFLINE: 'true'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Compute release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cli") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$RELEASE_TAG" = "v$crate_version"
            version=$crate_version
            prerelease=false
            if [[ "${version%%+*}" == *-* ]]; then
              prerelease=true
            fi
          else
            latest=$(git ls-remote --tags --refs origin 'v*' | awk '{print $2}' \
              | sed -n 's|^refs/tags/v\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$|\1|p' | sort -V | tail -n 1)
            version=$crate_version
            if [[ -n "$latest" ]]; then
              version=$(printf '%s\n' "$crate_version" "${latest%.*}.$((${latest##*.} + 1))" | sort -V | tail -n 1)
            fi
            prerelease=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::tag v$version already exists"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Add both macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Set workspace version
        if: github.ref_type == 'branch'
        run: |
          sed -i.orig "/^\[workspace.package\]/,/^\[/ s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" Cargo.toml
          rm Cargo.toml.orig
          cargo update --workspace
          test -z "$(git diff -U0 Cargo.lock | grep '^[-+][^-+]' | grep -v '^[-+]version = ')"
      - name: Check workspace version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cli") | .version')
          test "$crate_version" = "$RELEASE_VERSION"
      - name: Build ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == universal-apple-darwin ]]; then
            for arch in aarch64 x86_64; do
              cargo build --release --locked --target "$arch-apple-darwin" -p rivethub --bin rh -p cli --bin rivethub-migrate
            done
            mkdir -p "target/$TARGET/release"
            for bin in rh rivethub-migrate; do
              lipo -create -output "target/$TARGET/release/$bin" \
                "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
              lipo "target/$TARGET/release/$bin" -verify_arch arm64 x86_64
            done
          else
            cargo build --release --locked --target "$TARGET" -p rivethub --bin rh -p cli --bin rivethub-migrate
          fi
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          for bin in rh rivethub-migrate; do
            floor=$(objdump -T "target/$TARGET/release/$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n 1)
            echo "$bin requires $floor"
            if [[ "$(printf '%s\n' "$floor" GLIBC_2.35 | sort -V | tail -n 1)" != GLIBC_2.35 ]]; then
              echo "::error::$bin requires $floor, above the GLIBC_2.35 floor"
              exit 1
            fi
          done
      - name: Archive
        run: |
          mkdir release staging
          cp "target/$TARGET/release/rh" "target/$TARGET/release/rivethub-migrate" LICENSE staging/
          COPYFILE_DISABLE=1 tar --format=ustar -C staging -czf "release/rh-$RELEASE_VERSION-$TARGET.tar.gz" LICENSE rh rivethub-migrate
      - name: Smoke test the archive
        run: |
          archive="release/rh-$RELEASE_VERSION-$TARGET.tar.gz"
          test "$(tar -tzf "$archive" | sort | paste -sd ' ' -)" = "LICENSE rh rivethub-migrate"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/home/.rivethub"
          tar -xzf "$archive" -C "$smoke"
          expected="RivetHub v$RELEASE_VERSION ($(git rev-parse --short HEAD))"
          actual=$("$smoke/rh" version)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::rh version printed '$actual', expected '$expected'"
            exit 1
          fi
          export HOME="$smoke/home"
          cat > "$HOME/.rivethub/config.yaml" <<EOF
          runtime:
            workspace: $HOME
            default_agent: main
          agents:
            main:
              provider: local
          providers:
            local:
              type: openai-compatible
              base_url: http://127.0.0.1:1/v1
              model: smoke
          memory:
            backend: sqlite
            sqlite:
              path: $HOME/memory.sqlite
          EOF
          "$smoke/rh" db migrate
          "$smoke/rh" doctor | tee "$smoke/doctor.txt"
          grep -q '^pass: memory' "$smoke/doctor.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum rh-*.tar.gz > SHA256SUMS
      - name: Tag the merge commit
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          release_args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == true ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_args[@]}" release/*
