name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"

jobs:
  gate:
    name: Gate (cargo xtask check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          components: rustc-dev, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tools
        run: |
          cargo install cargo-dylint dylint-link --locked
          cargo install cargo-deny --locked
          cargo install cargo-machete --locked
      - name: cargo xtask check
        run: cargo xtask check --locked

  commits:
    name: Commits (house identity, no attribution, Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: House identity and attribution
        run: cargo xtask commits "origin/${{ github.base_ref }}..HEAD"
      - name: Conventional Commits
        uses: crate-ci/committed@v1.1.11
        with:
          args: --no-wip
          commits: "origin/${{ github.base_ref }}..HEAD"

  macos:
    name: macOS (rh build, cli tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Postgres with pgvector
        run: |
          brew install postgresql@17 pgvector
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@17
          for _ in $(seq 1 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Build rh
        run: cargo build --release --locked -p rivethub --bin rh
      - name: cli tests
        run: cargo nextest run --locked -p cli --all-features --profile macos --no-fail-fast

  rust:
    name: Tests (coverage) and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny
      - name: sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Tests under the coverage floor
        run: cargo llvm-cov nextest --workspace --all-features --locked --fail-under-lines "$(cat coverage-floor.txt)" --summary-only
      - name: Query data is current
        run: |
          cargo sqlx migrate run --source crates/migrate/migrations
          cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "false"
      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked
      - name: Build
        run: cargo build --workspace --locked
