name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate (cargo xtask check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2026-10-11
        with:
          components: rustc-dev, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          cargo install cargo-dylint dylint-link --locked
          cargo install cargo-deny --locked
      - name: cargo xtask check
        run: cargo xtask check --locked

  commits:
    name: Commits (house identity, no attribution, Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: House identity and attribution
        run: cargo xtask commits "origin/${{ github.base_ref }}..HEAD"
      - name: Conventional Commits
        uses: crate-ci/committed@v1
        with:
          args: --no-wip
          commits: "origin/${{ github.base_ref }}..HEAD"

  rust:
    name: Tests (coverage) and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-machete
      - name: Tests under the coverage floor
        run: cargo llvm-cov nextest --workspace --all-features --locked --fail-under-lines "$(cat coverage-floor.txt)" --summary-only
      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked
      - name: Unused dependencies
        run: cargo machete
      - name: Build
        run: cargo build --workspace --locked
