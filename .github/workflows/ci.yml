name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"

jobs:
  gate:
    name: Gate (cargo xtask check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          components: rustc-dev, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Dylint (prebuilt, matches lints/ dylint_linting)
        env:
          DYLINT_VERSION: 6.1.1
        run: |
          base="https://github.com/trailofbits/dylint/releases/download/v${DYLINT_VERSION}"
          for pair in \
            cargo-dylint:6a4a9c163dd12093347b64d83e4202d3421c60ecfc4a5a9a10b3654ae742cec4 \
            dylint-link:e570e1d6ffe6528960521f81e719b22a3964e1971688a012ad8f50189594356d; do
            tool="${pair%%:*}"
            archive="${tool}-x86_64-unknown-linux-gnu-v${DYLINT_VERSION}.tar.gz"
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
            echo "${pair#*:}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
            tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
            install -m 755 "${RUNNER_TEMP}/${archive%.tar.gz}/${tool}" "${CARGO_HOME:-$HOME/.cargo}/bin/${tool}"
          done
          cargo dylint --version
      - name: cargo xtask check
        # The Tests job compiles and runs every test binary, so the gate skips
        # the nextest list compile; a local `cargo xtask check` still runs it.
        run: cargo xtask check --locked --no-nextest-list

  commits:
    name: Commits (house identity, no attribution, Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: House identity and attribution
        run: cargo xtask commits "origin/${{ github.base_ref }}..HEAD"
      - name: Conventional Commits
        uses: crate-ci/committed@v1.1.11
        with:
          args: --no-wip
          commits: "origin/${{ github.base_ref }}..HEAD"

  macos:
    name: macOS (rh build, cli tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Postgres with pgvector
        run: |
          brew install postgresql@17 pgvector
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@17
          for _ in $(seq 1 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Build rh
        # Debug is enough to prove rh builds on macOS; release.yml ships the release binaries.
        run: cargo build --locked -p rivethub --bin rh
      - name: cli tests
        run: cargo nextest run --locked -p cli --all-features --profile macos --no-fail-fast
        env:
          TMPDIR: ${{ runner.temp }}

  rust:
    name: Tests (coverage) and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Tests under the coverage floor
        run: cargo llvm-cov nextest --workspace --all-features --locked --fail-under-lines "$(cat coverage-floor.txt)" --summary-only
      - name: Query data is current
        run: |
          cargo sqlx migrate run --source crates/migrate/migrations
          cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "false"
      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked
      - name: Build
        run: cargo build --workspace --locked
