[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "OpenSSL", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl", reason = "TLS is rustls everywhere" },
  { crate = "openssl-sys", reason = "TLS is rustls everywhere" },
  { crate = "native-tls", reason = "TLS is rustls everywhere" },
  { crate = "anyhow", reason = "errors are typed with thiserror; the binary maps them to exit codes" },
  { crate = "async-std", reason = "one async runtime: tokio" },
  { crate = "tmux_interface", reason = "herdr is the only multiplexer" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
