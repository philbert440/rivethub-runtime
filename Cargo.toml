[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["lints"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"
repository = "https://github.com/philbert440/rivethub-runtime"
rust-version = "1.99"

[workspace.metadata.dylint]
libraries = [{ path = "lints" }]

[workspace.dependencies]
agent-loop = { path = "crates/agent-loop", version = "0.1.0" }
agent-client-protocol = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
capture = { path = "crates/capture", version = "0.1.0" }
cargo_metadata = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
config = { path = "crates/config", version = "0.1.0" }
futures = "0.3"
gateway = { path = "crates/gateway", version = "0.1.0" }
eventsource-stream = "0.2"
hex = "0.4"
httparse = "1"
http-body = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
kernel = { path = "crates/kernel", version = "0.1.0" }
libtest-mimic = "0.8"
migrate = { path = "crates/migrate", version = "0.1.0" }
memory-postgres = { path = "crates/memory-postgres", version = "0.1.0" }
memory-sqlite = { path = "crates/memory-sqlite", version = "0.1.0" }
nix = { version = "0.30", features = ["process", "signal", "fs", "user"] }
parking_lot = "0.12"
pgvector = { version = "0.4", features = ["sqlx"] }
portable-pty = "0.9"
ra-ap-rustc_lexer = "0.177"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1"
regress = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.5", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
rustls-webpki = "0.103"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
serde_with = { version = "3", default-features = false, features = ["macros"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
similar-asserts = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate"] }
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
testkit = { path = "crates/testkit", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1" }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wire = { path = "crates/wire", version = "0.1.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(dylint_lib, values(any()))'] }
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
option_option = "deny"
derivable_impls = "deny"
mem_forget = "deny"
indexing_slicing = "warn"
wildcard_enum_match_arm = "warn"
large_futures = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
future_not_send = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
