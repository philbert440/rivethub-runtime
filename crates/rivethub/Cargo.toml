[package]
name = "rivethub"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "rh"

[lib]
name = "rivethub"
path = "src/lib.rs"

[[bin]]
name = "rh"
path = "src/main.rs"

[[bin]]
name = "rivetos"
path = "src/bin/rivetos.rs"

[dependencies]
chrono-tz = { workspace = true }
cli = { workspace = true }
agent-loop.workspace = true
async-trait.workspace = true
axum.workspace = true
capture.workspace = true
chrono.workspace = true
harness-acp.workspace = true
providers.workspace = true
serde.workspace = true
serde_json.workspace = true
tasks.workspace = true
terminal.workspace = true
url.workspace = true
wire.workspace = true
config = { workspace = true }
gateway = { workspace = true }
kernel = { workspace = true }
mcp = { workspace = true }
memory-postgres = { workspace = true }
memory-sqlite = { workspace = true }
pki = { workspace = true }
workers = { workspace = true }
nix = { workspace = true, features = ["hostname", "inotify", "signal"] }
rustls-pki-types.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser.workspace = true

[dev-dependencies]
rusqlite = { workspace = true }
futures.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["__rustls-tls"] }
migrate = { workspace = true }
reqwest = { workspace = true }
serde_yaml_ng = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
testkit = { workspace = true }
tower = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["io-util", "macros", "process"] }

[lints]
workspace = true
